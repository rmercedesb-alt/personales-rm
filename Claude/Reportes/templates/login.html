<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Reportería – Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand-dark:  #0d1b2a;
      --brand-mid:   #1b3a5c;
      --brand-accent:#2e86de;
      --brand-light: #e8f0fe;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-mid) 60%, #1a5276 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      padding: 50px 42px 42px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .icon-wrap {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-accent), #1a6bdb);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
      box-shadow: 0 8px 24px rgba(46,134,222,.45);
    }
    .icon-wrap i { font-size: 2.4rem; color: #fff; }
    .login-title { font-size: 1.45rem; font-weight: 700; color: var(--brand-dark); margin-bottom: 4px; }
    .login-subtitle { font-size: .88rem; color: #6c757d; margin-bottom: 28px; }
    .form-label { font-size: .82rem; font-weight: 600; color: #495057; text-align: left; display: block; margin-bottom: 4px; }
    .form-control {
      border-radius: 8px; border: 1.5px solid #dee2e6;
      padding: 10px 14px; font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 3px rgba(46,134,222,.18);
    }
    .btn-login {
      background: linear-gradient(135deg, var(--brand-accent), #1a6bdb);
      color: #fff; border: none; border-radius: 8px;
      padding: 11px; font-size: 1rem; font-weight: 600;
      width: 100%; margin-top: 8px;
      transition: opacity .2s, transform .1s;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); }
    .alert-danger { border-radius: 8px; font-size: .9rem; }
    .version-tag { font-size: .75rem; color: #adb5bd; margin-top: 22px; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .field-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #adb5bd; font-size: .95rem;
    }
    .input-icon-wrap .form-control { padding-left: 36px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon-wrap">
      <i class="fas fa-chart-bar"></i>
    </div>
    <div class="login-title">Sistema de Reportería</div>
    <div class="login-subtitle">MovilBusiness — Ingrese sus credenciales</div>

    {% if error %}
    <div class="alert alert-danger">
      <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3 text-start">
        <label class="form-label">Usuario</label>
        <div class="input-icon-wrap">
          <i class="fas fa-user field-icon"></i>
          <input type="text" name="usuario" class="form-control" placeholder="Nombre de usuario" autofocus required>
        </div>
      </div>
      <div class="mb-4 text-start">
        <label class="form-label">Contraseña</label>
        <div class="input-icon-wrap">
          <i class="fas fa-lock field-icon"></i>
          <input type="password" name="clave" class="form-control" placeholder="Contraseña" required>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
      </button>
    </form>
    <div class="version-tag">v1.0 &nbsp;·&nbsp; MovilBusiness5STD</div>
  </div>
</body>
</html>
