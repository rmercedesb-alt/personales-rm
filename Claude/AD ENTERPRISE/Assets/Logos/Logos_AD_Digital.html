<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Opciones de Logo — AD ALL DIGITAL</title>
<style>
  body { background: #1a1a2e; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 60px; }
  .option { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .label { color: #aaa; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .variants { display: flex; gap: 40px; align-items: center; }
  .bg-white { background: white; padding: 20px; border-radius: 8px; }
  .bg-dark { background: #0d0d1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
  h1 { color: white; font-size: 18px; letter-spacing: 3px; margin-bottom: 0; }
  .divider { width: 100%; height: 1px; background: #333; }
</style>
</head>
<body>

<h1>OPCIONES DE LOGO — AD ALL DIGITAL</h1>

<!-- ═══════════════ OPCIÓN 1 ═══════════════ -->
<div class="option">
  <div class="label">Opción 1 — Moderno / Geométrico</div>
  <div class="variants">

    <!-- Fondo blanco -->
    <div class="bg-white">
      <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Fondo cuadrado redondeado verde oscuro -->
        <rect x="10" y="8" width="80" height="80" rx="12" fill="#1a5c38"/>
        <!-- Letra A -->
        <text x="22" y="65" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white">A</text>
        <!-- Letra D en verde claro -->
        <text x="52" y="65" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#4caf7d">D</text>
        <!-- Línea separadora -->
        <line x1="100" y1="20" x2="100" y2="80" stroke="#1a5c38" stroke-width="2"/>
        <!-- Texto ALL DIGITAL -->
        <text x="108" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5c38" letter-spacing="2">ALL</text>
        <text x="108" y="67" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4caf7d" letter-spacing="2">DIGITAL</text>
        <!-- Línea debajo -->
        <line x1="10" y1="96" x2="190" y2="96" stroke="#1a5c38" stroke-width="1.5"/>
        <text x="10" y="112" font-family="Arial, sans-serif" font-size="9" fill="#888" letter-spacing="3">ENTERPRISE</text>
      </svg>
    </div>

    <!-- Fondo oscuro -->
    <div class="bg-dark">
      <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="8" width="80" height="80" rx="12" fill="#1a5c38"/>
        <text x="22" y="65" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white">A</text>
        <text x="52" y="65" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#4caf7d">D</text>
        <line x1="100" y1="20" x2="100" y2="80" stroke="#4caf7d" stroke-width="2"/>
        <text x="108" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">ALL</text>
        <text x="108" y="67" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4caf7d" letter-spacing="2">DIGITAL</text>
        <line x1="10" y1="96" x2="190" y2="96" stroke="#4caf7d" stroke-width="1.5"/>
        <text x="10" y="112" font-family="Arial, sans-serif" font-size="9" fill="#888" letter-spacing="3">ENTERPRISE</text>
      </svg>
    </div>

  </div>
</div>

<div class="divider"></div>

<!-- ═══════════════ OPCIÓN 2 ═══════════════ -->
<div class="option">
  <div class="label">Opción 2 — Corporativo / Azul Tecnológico</div>
  <div class="variants">

    <div class="bg-white">
      <svg width="220" height="120" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Círculo de fondo -->
        <circle cx="50" cy="52" r="44" fill="#0a2463"/>
        <!-- Gradiente visual: segundo círculo decorativo -->
        <circle cx="62" cy="42" r="28" fill="#1e4db7" opacity="0.5"/>
        <!-- AD grande centrado en círculo -->
        <text x="18" y="68" font-family="Georgia, serif" font-size="46" font-weight="900" fill="white">AD</text>
        <!-- Texto derecho -->
        <text x="102" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#0a2463" letter-spacing="1">ALL</text>
        <text x="102" y="64" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#1e4db7" letter-spacing="1">DIGITAL</text>
        <!-- Línea decorativa -->
        <rect x="102" y="72" width="112" height="3" fill="#e63946" rx="2"/>
        <text x="102" y="90" font-family="Arial, sans-serif" font-size="9" fill="#999" letter-spacing="4">ENTERPRISE</text>
      </svg>
    </div>

    <div class="bg-dark">
      <svg width="220" height="120" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="52" r="44" fill="#0a2463"/>
        <circle cx="62" cy="42" r="28" fill="#1e4db7" opacity="0.5"/>
        <text x="18" y="68" font-family="Georgia, serif" font-size="46" font-weight="900" fill="white">AD</text>
        <text x="102" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="1">ALL</text>
        <text x="102" y="64" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#4d94ff" letter-spacing="1">DIGITAL</text>
        <rect x="102" y="72" width="112" height="3" fill="#e63946" rx="2"/>
        <text x="102" y="90" font-family="Arial, sans-serif" font-size="9" fill="#777" letter-spacing="4">ENTERPRISE</text>
      </svg>
    </div>

  </div>
</div>

<div class="divider"></div>

<!-- ═══════════════ OPCIÓN 3 ═══════════════ -->
<div class="option">
  <div class="label">Opción 3 — Elegante / Minimalista</div>
  <div class="variants">

    <div class="bg-white">
      <svg width="200" height="110" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
        <!-- A y D con colores divididos elegantes -->
        <text x="5" y="72" font-family="Arial Black, sans-serif" font-size="70" font-weight="900" fill="#212121">A</text>
        <text x="52" y="72" font-family="Arial Black, sans-serif" font-size="70" font-weight="900" fill="#c0392b">D</text>
        <!-- Línea vertical decorativa roja -->
        <rect x="108" y="8" width="3" height="70" fill="#c0392b" rx="2"/>
        <!-- Stack de texto -->
        <text x="120" y="38" font-family="Arial Narrow, Arial, sans-serif" font-size="18" font-weight="700" fill="#212121" letter-spacing="4">ALL</text>
        <text x="120" y="60" font-family="Arial Narrow, Arial, sans-serif" font-size="18" font-weight="700" fill="#212121" letter-spacing="2">DIGITAL</text>
        <!-- Línea inferior full -->
        <rect x="5" y="80" width="190" height="2" fill="#212121"/>
        <text x="5" y="96" font-family="Arial, sans-serif" font-size="8.5" fill="#999" letter-spacing="5">ENTERPRISE</text>
      </svg>
    </div>

    <div class="bg-dark">
      <svg width="200" height="110" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
        <text x="5" y="72" font-family="Arial Black, sans-serif" font-size="70" font-weight="900" fill="white">A</text>
        <text x="52" y="72" font-family="Arial Black, sans-serif" font-size="70" font-weight="900" fill="#e74c3c">D</text>
        <rect x="108" y="8" width="3" height="70" fill="#e74c3c" rx="2"/>
        <text x="120" y="38" font-family="Arial Narrow, Arial, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="4">ALL</text>
        <text x="120" y="60" font-family="Arial Narrow, Arial, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="2">DIGITAL</text>
        <rect x="5" y="80" width="190" height="2" fill="#e74c3c"/>
        <text x="5" y="96" font-family="Arial, sans-serif" font-size="8.5" fill="#666" letter-spacing="5">ENTERPRISE</text>
      </svg>
    </div>

  </div>
</div>

</body>
</html>
